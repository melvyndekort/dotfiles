[manager]
linemode = "size"

[mgr]
linemode = "size"

[opener]
pdf = [
  { run = 'mupdf "$1"', desc = "Open PDF", for = "linux" },
]
show = [
  { run = 'sxiv "$1"', desc = "Show", for = "linux" },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = ["pdf", "reveal"] },
  { mime = "video/*", use = ["play", "reveal"] },
  { name = "*.3gp", url = "*.3gp", use = ["play", "reveal"] },
  { name = "*.3g2", url = "*.3g2", use = ["play", "reveal"] },
  { name = "*.avchd", url = "*.avchd", use = ["play", "reveal"] },
  { name = "*.avi", url = "*.avi", use = ["play", "reveal"] },
  { name = "*.f4v", url = "*.f4v", use = ["play", "reveal"] },
  { name = "*.flv", url = "*.flv", use = ["play", "reveal"] },
  { name = "*.m4v", url = "*.m4v", use = ["play", "reveal"] },
  { name = "*.mkv", url = "*.mkv", use = ["play", "reveal"] },
  { name = "*.mov", url = "*.mov", use = ["play", "reveal"] },
  { name = "*.mp4", url = "*.mp4", use = ["play", "reveal"] },
  { name = "*.mpeg", url = "*.mpeg", use = ["play", "reveal"] },
  { name = "*.ogv", url = "*.ogv", use = ["play", "reveal"] },
  { name = "*.ts", url = "*.ts", use = ["play", "reveal"] },
  { name = "*.webm", url = "*.webm", use = ["play", "reveal"] },
  { name = "*.wmv", url = "*.wmv", use = ["play", "reveal"] },

  { mime = "image/*", use = ["show", "reveal"] },
  { name = "*.gif", url = "*.gif", use = ["show", "reveal"] },
  { name = "*.jpeg", url = "*.jpeg", use = ["show", "reveal"] },
  { name = "*.jpg", url = "*.jpg", use = ["show", "reveal"] },
  { name = "*.png", url = "*.png", use = ["show", "reveal"] },
  { name = "*.svg", url = "*.svg", use = ["show", "reveal"] },
  { name = "*.webp", url = "*.webp", use = ["show", "reveal"] },
]



