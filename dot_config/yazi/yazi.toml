[manager]
linemode = "size"

[mgr]
linemode = "size"

[opener]
mpv = [
  { run = 'mpv %s', orphan = true, desc = "mpv", for = "unix" },
]
pdf = [
  { run = 'mupdf %s', desc = "Open PDF", for = "unix" },
]
show = [
  { run = 'sxiv %s', desc = "Show", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = ["pdf", "reveal"] },
  { mime = "video/*", use = ["mpv", "reveal"] },
  { url = "*.3gp", use = ["mpv", "reveal"] },
  { url = "*.3g2", use = ["mpv", "reveal"] },
  { url = "*.avchd", use = ["mpv", "reveal"] },
  { url = "*.avi", use = ["mpv", "reveal"] },
  { url = "*.f4v", use = ["mpv", "reveal"] },
  { url = "*.flv", use = ["mpv", "reveal"] },
  { url = "*.m4v", use = ["mpv", "reveal"] },
  { url = "*.mkv", use = ["mpv", "reveal"] },
  { url = "*.mov", use = ["mpv", "reveal"] },
  { url = "*.mp4", use = ["mpv", "reveal"] },
  { url = "*.mpeg", use = ["mpv", "reveal"] },
  { url = "*.ogv", use = ["mpv", "reveal"] },
  { url = "*.ts", use = ["mpv", "reveal"] },
  { url = "*.webm", use = ["mpv", "reveal"] },
  { url = "*.wmv", use = ["mpv", "reveal"] },

  { mime = "image/*", use = ["show", "reveal"] },
  { url = "*.gif", use = ["show", "reveal"] },
  { url = "*.jpeg", use = ["show", "reveal"] },
  { url = "*.jpg", use = ["show", "reveal"] },
  { url = "*.png", use = ["show", "reveal"] },
  { url = "*.svg", use = ["show", "reveal"] },
  { url = "*.webp", use = ["show", "reveal"] },
]



